// P24 internal persistence control API. ProductCatalogService in demo.proto
// remains unchanged for all existing multilingual application clients.
syntax = "proto3";

package catalogadmin;

option go_package = "github.com/GoogleCloudPlatform/microservices-demo/src/productcatalogservice/genproto;hipstershop";

import "google/protobuf/empty.proto";

service CatalogAdminService {
  rpc ReplaceCatalog(ReplaceCatalogRequest) returns (CatalogAdminRevision) {}
  rpc GetStats(google.protobuf.Empty) returns (CatalogAdminStats) {}
}

message ReplaceCatalogRequest {
  // Serialized hipstershop.ListProductsResponse from demo.proto.
  bytes product_catalog = 1;
  uint64 expected_revision = 2;
  bool check_expected_revision = 3;
}

message CatalogAdminRevision {
  uint64 revision = 1;
}

message CatalogAdminStats {
  uint64 revision = 1;
  uint64 backend_reads = 2;
}
