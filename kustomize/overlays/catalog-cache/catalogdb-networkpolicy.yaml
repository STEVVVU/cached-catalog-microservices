apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: catalogdbservice
spec:
  podSelector:
    matchLabels:
      app: catalogdbservice
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: productcatalogservice
      ports:
        - protocol: TCP
          port: 3551
