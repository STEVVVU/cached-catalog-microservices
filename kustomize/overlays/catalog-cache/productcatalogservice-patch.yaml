apiVersion: apps/v1
kind: Deployment
metadata:
  name: productcatalogservice
spec:
  template:
    spec:
      containers:
        - name: server
          env:
            - name: CATALOG_BACKEND_ADDR
              value: catalogdbservice:3551
            - name: CATALOG_CACHE_MODE
              value: lease
            - name: CATALOG_CACHE_TTL
              value: 2s
            - name: CATALOG_BACKEND_TIMEOUT
              value: 2s
            - name: CATALOG_ADMIN_PORT
              value: "3552"
