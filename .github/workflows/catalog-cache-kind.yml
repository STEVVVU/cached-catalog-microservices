name: Product catalog kind smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: productcatalog-kind-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  catalog-cache-kind:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: src/productcatalogservice/go.sum
      - name: Verify manifest and run disposable kind integration
        id: smoke
        run: bash scripts/catalog-cache-kind-smoke.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.smoke.outputs.evidence_path != ''
        with:
          name: productcatalog-kind-evidence
          path: ${{ steps.smoke.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
