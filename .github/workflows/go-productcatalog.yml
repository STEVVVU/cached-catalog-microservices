name: Product catalog Go checks

on:
  pull_request:
    paths:
      - 'src/productcatalogservice/**'
      - 'protos/catalog_admin.proto'
      - 'kustomize/overlays/catalog-cache*/**'
      - '.agents/skills/verify-productcatalog/**'
      - 'scripts/catalog-cache-kind-smoke.sh'
      - '.github/workflows/go-productcatalog.yml'
  push:
    branches: [main]
    paths:
      - 'src/productcatalogservice/**'
      - 'protos/catalog_admin.proto'
      - 'kustomize/overlays/catalog-cache*/**'
      - '.agents/skills/verify-productcatalog/**'
      - 'scripts/catalog-cache-kind-smoke.sh'
      - '.github/workflows/go-productcatalog.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: productcatalog-go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src/productcatalogservice
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
          cache-dependency-path: src/productcatalogservice/go.sum
      - name: Verify formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            printf 'Go files need gofmt:\n%s\n' "$files"
            exit 1
          fi
      - name: Test
        run: go test -count=1 ./...
      - name: Race detector
        run: go test -race -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Drive real catalog processes
        id: verify
        working-directory: .
        run: pwsh -NoProfile -File .agents/skills/verify-productcatalog/verify.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.verify.outputs.evidence_path != ''
        with:
          name: productcatalog-process-evidence
          path: ${{ steps.verify.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 7
